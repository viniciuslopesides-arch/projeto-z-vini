<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BarberCash</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050507">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="login-container">
        <header>
            <h1>BarberCash</h1>
            <p>Business Management Elite</p>
        </header>

        <div class="input-group">
            <label>ACESSO DO OPERADOR</label>
            <input type="email" id="email" class="neon-input" placeholder="seu@email.com">
        </div>

        <div class="input-group">
            <label>CHAVE DE SEGURANÇA</label>
            <input type="password" id="password" class="neon-input" placeholder="••••••••">
        </div>

        <button class="btn-gold-premium" id="btnLogin">INICIAR SISTEMA</button>
        
        <button class="btn-reset" id="btnReset">Esqueci minha senha</button>

        <div id="message"></div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
