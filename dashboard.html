<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projeto Z - Dashboard Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --card: #0d0d12;
            --accent: #D4AF37;
            --gold-grad: linear-gradient(135deg, #B8860B 0%, #F9E274 50%, #D4AF37 100%);
            --text: #FFFFFF;
            --subtext: #94a3b8;
            --border: #1e1e26;
            --danger: #ff4d4d;
            --success: #39FF14;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding-bottom: 90px; overflow-x: hidden;
        }

        /* Header */
        header { padding: 25px 20px; background: var(--card); border-bottom: 1px solid var(--border); text-align: center; }
        h1 { 
            margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px;
            background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Cards de Faturamento */
        .caixa-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .mini-card { 
            background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border);
            text-align: center;
        }
        .mini-card span { font-size: 0.55rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        .mini-card b { font-size: 1rem; color: var(--accent); }
        .card-destaque { grid-column: span 2; background: var(--gold-grad); border: none; }
        .card-destaque span, .card-destaque b { color: #000; font-weight: 900; }

        /* Navegação Inferior */
        .nav-bottom {
            position: fixed; bottom: 0; width: 100%; background: var(--card);
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-btn { background: none; border: none; color: var(--subtext); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .nav-btn.active { color: var(--accent); }

        /* Seções e Itens */
        .section { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .client-item {
            background: var(--card); padding: 18px; border-radius: 18px; border: 1px solid var(--border);
            margin-bottom: 12px; position: relative;
        }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.6rem; font-weight: 900; }
        .badge-devendo { background: rgba(255, 77, 77, 0.1); color: var(--danger); }
        .badge-pago { background: rgba(57, 255, 20, 0.1); color: var(--success); }

        /* Forms */
        input, select {
            width: 100%; padding: 14px; background: #000; border: 1px solid var(--border);
            color: #fff; border-radius: 10px; margin-bottom: 12px; font-size: 0.9rem;
        }
        .btn-main {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: var(--gold-grad); color: #000; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; font-size: 0.85rem;
        }
        .btn-action { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--accent); background: none; color: var(--accent); font-size: 0.7rem; font-weight: 800; }

        /* Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
        }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--border); }

        /* Tabela de Devedores */
        .table-devedores { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table-devedores td { padding: 12px 5px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>Projeto Z</h1>
        <p id="user-display" style="font-size: 0.6rem; color: var(--accent); margin-top: 5px; letter-spacing: 1px;">CARREGANDO...</p>
    </header>

    <div class="caixa-resumo">
        <div class="mini-card card-destaque">
            <span>Faturamento Hoje</span>
            <b id="totalGeral" style="font-size: 1.6rem;">R$ 0,00</b>
        </div>
        <div class="mini-card"><span>Pix ⚡</span><b id="valPix">R$ 0,00</b></div>
        <div class="mini-card"><span>Dinheiro 💵</span><b id="valDinheiro">R$ 0,00</b></div>
        <div class="mini-card"><span>Débito 💳</span><b id="valDebito">R$ 0,00</b></div>
        <div class="mini-card"><span>Crédito 💳</span><b id="valCredito">R$ 0,00</b></div>
    </div>

    <section id="aba-lista" class="section active">
        <div id="listaGeral"></div>
    </section>

    <section id="aba-devedores" class="section">
        <h3>Lista de Devedores</h3>
        <table class="table-devedores">
            <tbody id="tabelaDevedoresBody"></tbody>
        </table>
        <p id="msgSemDevedores" style="display:none; text-align:center; color:var(--subtext); margin-top:30px;">Tudo em dia! ⚽</p>
    </section>

    <section id="aba-novo" class="section">
        <h3>Novo Registro</h3>
        <input type="text" id="nomeCliente" placeholder="Nome do Cliente">
        <select id="planoCliente"></select>
        <button class="btn-main" id="btnSalvar">Salvar no Firebase</button>
    </section>

    <section id="aba-config" class="section">
        <h3>Gestão de Planos</h3>
        <input type="text" id="plNome" placeholder="Nome do Plano">
        <input type="number" id="plPreco" placeholder="Preço R$">
        <input type="number" id="plCortes" placeholder="Qtd de Cortes">
        <button class="btn-main" id="btnNovoPlano">+ Adicionar Plano</button>
        <div id="listaPlanosGestao" style="margin-top: 20px;"></div>

        <hr style="border:0; border-top:1px solid var(--border); margin: 30px 0;">
        
        <h3>Backup e Sistema</h3>
        <button class="btn-main" style="background:#222; color:#fff; margin-bottom:10px" onclick="window.exportarDados()">Exportar JSON</button>
        <label class="btn-main" style="background:#222; color:#fff; display:block; text-align:center; cursor:pointer; padding: 15px;">
            Importar JSON <input type="file" id="importFile" style="display:none" onchange="window.importarDados(event)">
        </label>
        <button class="btn-main" style="background:var(--danger); color:#fff; margin-top:20px" id="btnFecharCaixa">FECHAR CAIXA DO DIA</button>
        <button class="btn-main" style="background:transparent; color:var(--subtext); margin-top:10px" id="btnLogout">Sair</button>
    </section>

    <div id="modalPagamento" class="modal">
        <div class="modal-content">
            <h2 id="msgPag" style="color:var(--accent); font-size: 1.2rem;"></h2>
            <input type="number" id="vEntrada" placeholder="Valor">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn-main" onclick="confirmarPagamento('Pix')">PIX</button>
                <button class="btn-main" onclick="confirmarPagamento('Dinheiro')">DINHEIRO</button>
                <button class="btn-main" onclick="confirmarPagamento('Débito')">DÉBITO</button>
                <button class="btn-main" onclick="confirmarPagamento('Crédito')">CRÉDITO</button>
            </div>
            <button onclick="document.getElementById('modalPagamento').style.display='none'" style="background:none; border:none; color:var(--subtext); margin-top:20px;">Fechar</button>
        </div>
    </div>

    <nav class="nav-bottom">
        <button class="nav-btn active" onclick="showTab('aba-lista', this)">Geral</button>
        <button class="nav-btn" onclick="showTab('aba-devedores', this)">Devedores</button>
        <button class="nav-btn" onclick="showTab('aba-novo', this)">+ Novo</button>
        <button class="nav-btn" onclick="showTab('aba-config', this)">Config</button>
    </nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, updateDoc, doc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCsvNMfta3Y2sQUxYHunCIyTcrrH6eT6j8",
        authDomain: "projetoz-do-vini.firebaseapp.com",
        projectId: "projetoz-do-vini",
        storageBucket: "projetoz-do-vini.firebasestorage.app",
        messagingSenderId: "183074290629",
        appId: "1:183074290629:web:1823c0f0428d2d9bc869ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentPlanos = {};
    let tempId = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('user-display').innerText = `LOGADO: ${user.email.split('@')[0].toUpperCase()}`;
            ouvirDados();
        } else {
            window.location.href = "index.html";
        }
    });

    function ouvirDados() {
        const uid = auth.currentUser.uid;

        // Escutar Caixa
        onSnapshot(query(collection(db, "vendas_dia"), where("userId", "==", uid)), (snap) => {
            let cx = { Pix: 0, Dinheiro: 0, Débito: 0, Crédito: 0, Total: 0 };
            snap.forEach(d => {
                const v = d.data();
                if(cx[v.metodo] !== undefined) cx[v.metodo] += v.valor;
                cx.Total += v.valor;
            });
            document.getElementById('totalGeral').innerText = `R$ ${cx.Total.toFixed(2)}`;
            document.getElementById('valPix').innerText = `R$ ${cx.Pix.toFixed(2)}`;
            document.getElementById('valDinheiro').innerText = `R$ ${cx.Dinheiro.toFixed(2)}`;
            document.getElementById('valDebito').innerText = `R$ ${cx.Débito.toFixed(2)}`;
            document.getElementById('valCredito').innerText = `R$ ${cx.Crédito.toFixed(2)}`;
        });

        // Escutar Planos
        onSnapshot(query(collection(db, "planos"), where("userId", "==", uid)), (snap) => {
            const sel = document.getElementById('planoCliente');
            const gestao = document.getElementById('listaPlanosGestao');
            sel.innerHTML = ""; gestao.innerHTML = ""; currentPlanos = {};
            snap.forEach(d => {
                currentPlanos[d.id] = d.data();
                sel.innerHTML += `<option value="${d.id}">${d.data().nome}</option>`;
                gestao.innerHTML += `<div class="client-item" style="padding:12px; display:flex; justify-content:space-between">
                    <span>${d.data().nome} (R$ ${d.data().preco})</span>
                    <button onclick="window.removerPlano('${d.id}')" style="color:var(--danger); background:none; border:none;">✕</button>
                </div>`;
            });
        });

        // Escutar Atendimentos
        onSnapshot(query(collection(db, "atendimentos"), where("userId", "==", uid), orderBy("data", "desc")), (snap) => {
            const lista = document.getElementById('listaGeral');
            const devedores = document.getElementById('tabelaDevedoresBody');
            lista.innerHTML = ""; devedores.innerHTML = "";
            snap.forEach(d => {
                const c = d.data(); const id = d.id;
                lista.innerHTML += `
                <div class="client-item" style="border-left:4px solid ${c.restante > 0 ? 'var(--danger)' : 'var(--accent)'}">
                    <div style="display:flex; justify-content:space-between">
                        <strong>${c.nome.toUpperCase()}</strong>
                        <span class="badge ${c.restante > 0 ? 'badge-devendo' : 'badge-pago'}">${c.restante > 0 ? 'DEVENDO' : 'PAGO'}</span>
                    </div>
                    <div style="font-size:0.6rem; color:var(--subtext); margin-top:5px">${c.servico}</div>
                    <div style="display:flex; gap:10px; margin-top:15px">
                        <button class="btn-action" style="flex:1" onclick="window.atCorte('${id}', ${c.saldo})">Cortes: ${c.saldo}</button>
                        ${c.restante > 0 ? `<button class="btn-main" style="flex:1; padding:8px; font-size:0.7rem" onclick="window.abrirPg('${id}', ${c.restante})">RECEBER</button>` : ''}
                    </div>
                    <button style="position:absolute; top:10px; right:10px; background:none; border:none; color:#333" onclick="window.removerAtendimento('${id}')">✕</button>
                </div>`;
                if(c.restante > 0) {
                    devedores.innerHTML += `<tr><td><b>${c.nome}</b></td><td style="color:var(--danger)">R$ ${c.restante}</td><td><button class="btn-action" onclick="window.abrirPg('${id}', ${c.restante})">Pagar</button></td></tr>`;
                }
            });
            document.getElementById('msgSemDevedores').style.display = devedores.innerHTML === "" ? "block" : "none";
        });
    }

    // Funções Globais
    window.showTab = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    };

    document.getElementById('btnSalvar').onclick = async () => {
        const nome = document.getElementById('nomeCliente').value;
        const pId = document.getElementById('planoCliente').value;
        if(!nome || !pId) return alert("Preencha tudo!");
        const p = currentPlanos[pId];
        await addDoc(collection(db, "atendimentos"), {
            nome, servico: p.nome, valorTotal: p.preco, restante: p.preco, saldo: p.cortes,
            userId: auth.currentUser.uid, data: new Date()
        });
        document.getElementById('nomeCliente').value = "";
        window.showTab('aba-lista', document.querySelector('.nav-btn'));
    };

    window.abrirPg = (id, valor) => {
        tempId = id; document.getElementById('msgPag').innerText = `Receber R$ ${valor}`;
        document.getElementById('vEntrada').value = valor;
        document.getElementById('modalPagamento').style.display = 'flex';
    };

    window.confirmarPagamento = async (metodo) => {
        const v = parseFloat(document.getElementById('vEntrada').value);
        if(!v || !tempId) return;
        await addDoc(collection(db, "vendas_dia"), { valor: v, metodo, userId: auth.currentUser.uid, data: new Date() });
        const docRef = doc(db, "atendimentos", tempId);
        const snap = await getDocs(query(collection(db, "atendimentos"), where("__name__", "==", tempId)));
        const atual = snap.docs[0].data().restante;
        await updateDoc(docRef, { restante: Math.max(0, atual - v) });
        document.getElementById('modalPagamento').style.display = 'none';
    };

    window.atCorte = async (id, saldo) => {
        if(saldo > 0) await updateDoc(doc(db, "atendimentos", id), { saldo: saldo - 1 });
        else alert("Sem saldo de cortes!");
    };

    document.getElementById('btnNovoPlano').onclick = async () => {
        const nome = document.getElementById('plNome').value;
        const preco = parseFloat(document.getElementById('plPreco').value);
        const cortes = parseInt(document.getElementById('plCortes').value);
        await addDoc(collection(db, "planos"), { nome, preco, cortes, userId: auth.currentUser.uid });
        document.getElementById('plNome').value = ""; document.getElementById('plPreco').value = ""; document.getElementById('plCortes').value = "";
    };

    document.getElementById('btnFecharCaixa').onclick = async () => {
        if(!confirm("Fechar caixa hoje?")) return;
        const uid = auth.currentUser.uid;
        const vendas = await getDocs(query(collection(db, "vendas_dia"), where("userId", "==", uid)));
        for(let d of vendas.docs) await deleteDoc(doc(db, "vendas_dia", d.id));
        const atendimentos = await getDocs(query(collection(db, "atendimentos"), where("userId", "==", uid)));
        for(let d of atendimentos.docs) {
            if(d.data().restante <= 0 && d.data().saldo <= 0) await deleteDoc(doc(db, "atendimentos", d.id));
        }
        alert("Caixa Fechado!");
    };

    window.exportarDados = async () => {
        const uid = auth.currentUser.uid;
        const qAtend = await getDocs(query(collection(db, "atendimentos"), where("userId", "==", uid)));
        const qPlanos = await getDocs(query(collection(db, "planos"), where("userId", "==", uid)));
        let backup = { atendimentos: qAtend.docs.map(d => d.data()), planos: qPlanos.docs.map(d => d.data()) };
        const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = "ProjetoZ_Backup.json"; a.click();
    };

    window.removerAtendimento = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "atendimentos", id)); };
    window.removerPlano = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "planos", id)); };
    document.getElementById('btnLogout').onclick = () => signOut(auth);

</script>
</body>
</html>
